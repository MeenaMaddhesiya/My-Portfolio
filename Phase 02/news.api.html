<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News API Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        h1 {
            text-align:center;
        }
    </style>
</head>
<body>
    <h1>India's Top News of last month</h1>
    <script>
        const url = "https://newsapi.org/v2/everything?q=india&from=2026-10-17&sortBy=publishedAt&apiKey=API_KEY";
        fetch(url)
            .then(response => response.json())
            .then(data => {
                data.articles.forEach(article => {
                    console.log(article);
                    const articleElement = document.createElement('div');
                    articleElement.innerHTML = `<h3>${article.title}</h3><p>${article.description}</p><a href="${article.url}" target="_blank">Read more</a>`;
                    document.body.appendChild(articleElement);
                });
            })
    </script>
</body>
</html>
