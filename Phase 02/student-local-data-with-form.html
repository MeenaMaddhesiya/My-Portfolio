<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data</title>
    <style>
        *{
            box-sizing: border-box;
        }
        h1{
            text-align:center;
        }
        body{
            font-family:Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        form{
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        label{
            display: block;
            margin-bottom: 5px;
            font-weight:bold;
        }
        input[type="text"], input[type="email"]{
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button{
            background-color: #28a745;
            color: #fff;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover{
            background-color: #218838;
        }

    </style>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form id="studentForm">
        <label for="name">Name:</label>
        <!--20Char, Non Empty-->
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <!--validate Email, Non Empty,@-->
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
         <!--Min 8Char, Non Empty, Special Char, uppercase,lowercase-->
        <input type="password" id="password" name="password" required><br><br>
        <label for="phone">Phone:</label>
        <!--10Char, Non Empty-->
        <input type="text"id="phone" name="phone" required><br><br>
        
        
        <button onclick="validateForm()"type="submit">Submit</button>
    </form>
     
    <p id="studentData"> No Data</p>
    <script>
        validateForm=()=>{
            const form = document.getElementById('studentForm');
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value;

            // Validate name
            if (name.length > 20 || name.trim() === '') {
                alert('Name must be non-empty and less than or equal to 20 characters.');
                return;
            }

            // Validate email
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                alert('Please enter a valid email address.');
                return;
            }

            // Validate password
            const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{6,}$/;
            if (!passwordPattern.test(password)) {
                alert('Password must be at least 6 characters long and include uppercase, lowercase, number, and special character.');
                return;
            }

            // Validate phone
            if (phone.length !== 10 || isNaN(phone)) {
                alert('Phone number must be exactly 10 digits.');
                return;
            }
            form.addEventListener('submit',function(event){
                event.preventDefault();
                if (form.checkValidity()=== false){
                    alert('Please fill out the form correctly.');
                }else{
                    setLocally();
                }
            });
        }
        setLocally = () => {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value;

            // Create an object to store the data
            const studentData = {
                name: name,
                email: email,
                password: password,
                course: phone
            };

            console.log(studentData);
            const stringData = JSON.stringify(studentData)
            console.log(stringData);
            localStorage.setItem('studentData',stringData);
            alert('Student data saved successfully!');

            const getData = localStorage.getItem('studentData');
            const parseData = JSON.parse(getData);

            const studentDataParagraph = document.getElementById('studentData');
            studentDataParagraph.textContent = studentData.name + ','+studentData.email+
            ','+studentData.password + ',' + studentData.phone;
            

            


        }
    </script>

</body>
</html>
